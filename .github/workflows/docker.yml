name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gatesql/gatesql:latest
            gatesql/gatesql:${{ github.sha }}

      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gatesql/gatesql:demo

      - name: Build and push demo-opencode image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo-opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gatesql/gatesql:demo-opencode

  test:
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Smoke test Docker images
        run: ./scripts/test-docker.sh
