name: Staging Build

on:
  push:
    branches: [staging]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: gatesql/gatesql:staging

      - name: Build and push staging demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: true
          tags: gatesql/gatesql:demo-staging

      - name: Build and push staging demo-opencode image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo-opencode
          push: true
          tags: gatesql/gatesql:demo-opencode-staging
