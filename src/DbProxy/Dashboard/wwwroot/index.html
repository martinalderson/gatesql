<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Proxy Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e5e5e5; }
        .header { padding: 20px 32px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
        .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px; }
        .section { margin-bottom: 40px; }
        .section h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: #737373; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 8px 12px; color: #737373; font-weight: 500; border-bottom: 1px solid #1a1a1a; }
        td { padding: 8px 12px; border-bottom: 1px solid #111; font-variant-numeric: tabular-nums; }
        tr:hover td { background: #111; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .badge-green { background: #052e16; color: #4ade80; }
        .badge-red { background: #2a0a0a; color: #f87171; }
        .badge-yellow { background: #2a2000; color: #fbbf24; }
        .badge-gray { background: #1a1a1a; color: #737373; }
        .query-text { max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: #a3a3a3; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: #111; border: 1px solid #1a1a1a; border-radius: 8px; padding: 16px; }
        .stat-card .label { font-size: 12px; color: #737373; margin-bottom: 4px; }
        .stat-card .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .empty { padding: 32px; text-align: center; color: #525252; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="dot"></div>
        <h1>DB Proxy</h1>
    </div>
    <div class="container">
        <div class="stats" id="stats"></div>

        <div class="section">
            <h2>Active Sessions</h2>
            <table>
                <thead>
                    <tr>
                        <th>Agent</th>
                        <th>Task</th>
                        <th>Status</th>
                        <th>Queries</th>
                        <th>Connected</th>
                        <th>Last Activity</th>
                    </tr>
                </thead>
                <tbody id="sessions"></tbody>
            </table>
        </div>

        <div class="section">
            <h2>Recent Queries</h2>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Agent</th>
                        <th>Query</th>
                        <th>Rows</th>
                        <th>Duration</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="queries"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
